name: Windows UI checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt black==26.5.1
      - run: python -m black --check main.py icons.py appearance.py glass_ui.py settings_dialog.py windows_effects.py data_manager.py theme_manager.py ui_manager.py tests
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python tests/windows_smoke.py
